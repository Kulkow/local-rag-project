name: enterprise-rag
x-app: &app
  image: enterprise-rag-api:local
  build: {context: ., target: runtime}
  restart: unless-stopped
  mem_limit: 512m
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rag}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    MINIO_URL: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}}
    DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-rag-documents}
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    CHUNK_SIZE: ${CHUNK_SIZE:-1000}
    CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
    EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
    MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-2000}
    RAG_RERANKING: ${RAG_RERANKING:-true}
    RAG_QUERY_REWRITING: ${RAG_QUERY_REWRITING:-true}
    RAG_MIN_VECTOR_SCORE: ${RAG_MIN_VECTOR_SCORE:-0.35}
services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.1-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 192mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    mem_limit: 256m
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    mem_limit: 1g
    volumes: [qdrant-data:/qdrant/storage]
  minio:
    image: enterprise-rag-minio:local
    build: {context: ./infra/minio, target: runtime}
    command: server /data --console-address ':9001'
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports: ['127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  migrate:
    <<: *app
    restart: 'no'
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    mem_limit: 1g
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.smoke]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
  worker:
    <<: *app
    mem_limit: 1g
    command: [celery, -A, app.infrastructure.queue.tasks:celery_app, worker, --loglevel=WARNING, --concurrency=1, --beat, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.infrastructure.queue.tasks:celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5']
      interval: 30s
      timeout: 10s
      retries: 5
  web-admin:
    build: ./web-admin
    restart: unless-stopped
    mem_limit: 128m
    ports: ['127.0.0.1:3000:8080']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 3s
      retries: 5
  queue-metrics:
    <<: *app
    profiles: [monitoring]
    command: [uvicorn, app.observability.queue_metrics:app, --host, '0.0.0.0', --port, '9100', --no-access-log]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import httpx; httpx.get('http://127.0.0.1:9100/metrics',timeout=6).raise_for_status()"]
      interval: 15s
      timeout: 8s
      retries: 5
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./infra/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [queue-metrics]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-${ADMIN_USERNAME:?Set ADMIN_USERNAME}}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 10
  checks:
    <<: *app
    profiles: [tools]
    build: {context: ., target: checks}
    image: enterprise-rag-checks:local
    restart: 'no'
    environment:
      <<: *app-env
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag}
    depends_on:
      migrate: {condition: service_completed_successfully}
  web-checks:
    profiles: [tools]
    build: {context: ./web-admin, target: builder}
    command: [sh, -c, 'npx openapi-typescript openapi.json -o src/shared/infrastructure/schema.ts && npm test && npm run build']
    restart: 'no'
volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  prometheus-data:
  grafana-data:
